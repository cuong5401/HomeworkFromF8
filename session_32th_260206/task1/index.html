<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 
    Lesson 1: Adding a Paragraph
    There is a "Add Paragraph" button.
    Click it → create a <p> with the content "Hello DOM" and add it to the page.
    -->
    <main class="main">
        <button id="add" class="add">Add paragraph</button>
        <div id="content" class="content"></div>
    </main>

    <script>
        document.querySelector('#add').addEventListener("click", () => {
            const para = document.createElement('p');
            para.textContent = 'Hello DOM';
            document.querySelector('#content').appendChild(para);
        }
        )
    </script>
</body>

</html>
