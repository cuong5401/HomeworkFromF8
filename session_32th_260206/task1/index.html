<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="add-para">Add paragraph</button>
    <main id="main"></main>
    <script>
        document.querySelector('#add-para').addEventListener("click", () => {
            const para = document.createElement('p');
            para.textContent = 'Hello DOM';
            document.querySelector('#main').appendChild(para);
        }
        )
    </script>
</body>

</html>
