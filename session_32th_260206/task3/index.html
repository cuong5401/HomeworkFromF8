<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- 
    Lesson 3: Print What You Input
    You have a <input> and an “Add” button.
    Click → to get the text from the input.
    Create a <p> to contain that content.
    Clear the input after adding it. 
    -->

    <main id="main" class="main">
        <form id="form-input" action="">
            <input id="input-text" type="text" autocomplete="off">
            <button id="add">Add</button>
        </form>
    </main>
    <script>
        const main = document.querySelector('#main');
        const input = document.querySelector('#input-text');

        document.querySelector('#add').addEventListener("click", (event) => {
            event.preventDefault();
            if (input.value.trim() === '') {
                input.value = '';
                return;
            }
            const para = document.createElement('p');
            para.textContent = input.value.trim();
            main.appendChild(para);
            input.value = '';
        }
        )
    </script>
</body>

</html>
