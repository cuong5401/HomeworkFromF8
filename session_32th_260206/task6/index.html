<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
</head>

<body>
    <!-- 
        Lesson 6: Deleting an Item
        Each <li> has an X button added.
        Click X → delete that <li> item.
    -->

    <main>
        <form id="form" action="" autocomplete="off">
            <input name="todo" id="form_input" type="text">
            <button>Add</button>
        </form>
        <ul id="todo-list"></ul>
    </main>
    <script>
        const form = document.getElementById('form');
        const input = document.getElementById('form_input');
        const todoList = document.getElementById('todo-list');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputValue = input.value.trim();
            input.value = '';
            if (!inputValue) return;

            const li = document.createElement('li');
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = '✕';
            li.innerText = inputValue + ' ';
            li.appendChild(deleteBtn);
            todoList.appendChild(li)
            deleteBtn.addEventListener('click', (e) => {
                li.remove();
            })
        })

    </script>
</body>

</html>
