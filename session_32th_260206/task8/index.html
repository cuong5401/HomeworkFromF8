<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8</title>
    <style>
        li {
            user-select: none;
            cursor: pointer;
        }

        .item-done {
            text-decoration: line-through;
        }

        .item-bg-blue {
            background-color: blue;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- 
    Lesson 8: Selected Lists
    Click on a <li> → change the background to blue
    Only one item can be selected at a time
    Click another item → deselect the old item
    -->
    <main>
        <form id="form" action="" autocomplete="off">
            <input name="todo" id="form_input" type="text">
            <button>Add</button>
        </form>
        <ul id="todo-list"></ul>
    </main>
    <script>
        const form = document.getElementById('form');
        const input = document.getElementById('form_input');
        const todoList = document.getElementById('todo-list');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputValue = input.value.trim();
            input.value = '';
            if (!inputValue) return;

            const li = document.createElement('li');
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = '✕';
            li.innerText = inputValue + ' ';
            li.appendChild(deleteBtn);
            todoList.appendChild(li)

            li.addEventListener('click', () => {
                //double click --> clear bg blue
                if (li.classList.contains('item-bg-blue')) {
                    li.classList.remove('item-bg-blue');
                    return;
                }
                todoList.querySelectorAll('.item-bg-blue').forEach((e) => {
                    e.classList.remove('item-bg-blue');
                });
                li.classList.add('item-bg-blue');
            })
            deleteBtn.addEventListener('click', (e) => {
                li.remove();
            })
        })

    </script>
</body>

</html>
