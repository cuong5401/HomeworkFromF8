<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li {
            user-select: none;
            cursor: pointer;
        }

        .bg-blue {
            background-color: blue;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- 
    Lesson 8: Selected Lists
    Click on an item → change the background to blue
    Only one item is selected at a time
    Click another item → deselect the old item 
    -->

    <main>
        <input id="input-text" type="text" autocomplete="off">
        <button id="add-item">Add</button>
        <ul id="items"></ul>
    </main>

    <script>
        let i = 0;
        document.querySelector('#add-item').addEventListener("click", () => {
            const input = document.querySelector('#input-text');
            if (input.value.trim() === '') {
                input.value = '';
                return;
            }
            const li = document.createElement('li');
            li.textContent = input.value.trim();
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'x';

            li.appendChild(deleteBtn);
            document.querySelector('#items').appendChild(li);
            input.value = '';

            li.addEventListener('click', (e) => {
                e.stopPropagation();
                const selected = document.querySelector('.bg-blue');
                if (selected) {
                    selected.classList.remove('bg-blue');
                }
                li.classList.add('bg-blue');
            }
            )
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                e.target.closest('li').remove();
            })
        }
        )
    </script>
</body>

</html>
