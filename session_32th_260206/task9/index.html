<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- 
    Lesson 9: Advanced Todo (Basic DOM Only)
    Interface
    There is one input field and one add button.
    The list of tasks is displayed in the ul `li`.
    Beside each task name, there is a "done" button (default background is yellow) and a "delete" button (red).
    If you click "done," the "done" button turns green.
    Clicking it again turns it yellow.
    Clicking the delete button removes the task.
    Add another input button to search for the added task.
    Add a checkbox with the label "done." If checked, only completed tasks will be displayed. 
    -->

    <main class="container">
        <h1 class="title">Advanced Todo</h1>
        <div class="control">
            <div class="control-row">
                <input id="task-input" type="text" placeholder="Add task...">
                <button id="add-work">Add</button>
            </div>
            <div class="control-row search-row">
                <input id="search-input" type="text" placeholder="Search task...">
                <button id="search-btn">Search</button>
            </div>
            <div class="control-row">
                <label for="doneWork">done work</label>
                <input id="doneWork" type="checkbox">
            </div>
        </div>
        <div id="content">
            <ul id="task-list"></ul>
        </div>

    </main>
    <script src="./script.js"></script>
</body>

</html>
