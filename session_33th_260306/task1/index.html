<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Login Form</h1>
    <form id="loginForm" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="admin"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="admin123"><br><br>
        <button type="submit">Login</button>
    </form>
    <div id="message"></div>
    <script src="./main.js"></script>
</body>

</html>
